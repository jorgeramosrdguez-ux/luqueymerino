<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Hemos renovado la web · Luque &amp; Merino</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <!-- Rutas absolutas: esta página puede servirse desde cualquier dirección -->
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .moved { min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; text-align: center; background: var(--linen-2); }
    .moved__card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: clamp(28px, 6vw, 48px); max-width: 560px; width: 100%; }
    .moved__card img { max-height: 54px; margin: 0 auto 1.4rem; }
    .moved__card h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); margin-bottom: .6rem; }
    .moved__card p { color: var(--ink-soft); margin: 0 0 1.6rem; }
    .moved__btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .moved__auto { font-size: .86rem; margin: 1.4rem 0 0 !important; }
  </style>
</head>
<body>
  <main class="moved">
    <div class="moved__card">
      <img src="/img/logo.png" alt="Luque &amp; Merino Decoración" />
      <h1>Hemos renovado la web</h1>
      <p>La página que buscabas ha cambiado de sitio. Todo nuestro catálogo, ofertas y servicios están en la nueva web.</p>
      <div class="moved__btns">
        <a class="btn btn--primary" href="/">Ir a la portada</a>
        <a class="btn btn--ghost" href="/?ir=catalogo">Ver el catálogo</a>
      </div>
      <p class="moved__auto" id="auto">Te llevamos a la portada en <strong id="secs">6</strong> segundos…</p>
    </div>
  </main>
  <script>
    // Cuenta atrás y salto a la portada para quien llega desde un enlace antiguo
    (function () {
      var n = 6, el = document.getElementById("secs");
      var t = setInterval(function () {
        n -= 1; if (el) el.textContent = n;
        if (n <= 0) { clearInterval(t); location.replace("/"); }
      }, 1000);
    })();
  </script>
</body>
</html>
